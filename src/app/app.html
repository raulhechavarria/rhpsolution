<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/home">RHP Solution</a>
    <nav class="topnav" aria-label="Primary">
      @for (item of navItems; track item.label) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/home' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
    <a class="nav-cta" routerLink="/contact">Book a call</a>
  </header>

  <main class="page-content">
    <router-outlet />
  </main>

  <footer class="footer">
    <nav class="footnav" aria-label="Footer">
      @for (item of socialLinks; track item.label) {
        <a
          class="nav-foot-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/home' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
    <p>© 2026 RHP Solution. All rights reserved.</p>
  </footer>
</div>
