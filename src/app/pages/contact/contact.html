<section class="contact-page">
  <div class="contact-panel panel">
    <div class="contact-copy">
      <span class="eyebrow">Contact</span>
      <h1>Let’s build a system that works for your business.</h1>
      <p>
        Tell us about your process, bottlenecks, and goals. We will help you define the right
        architecture, workflow, and software solution to improve performance and scale reliably.
      </p>

      <div class="contact-points">
        <div>
          <span class="label">Email</span>
          <strong>hello@rhpsolution.com</strong>
        </div>
        <div>
          <span class="label">Response time</span>
          <strong>Within 24 hours</strong>
        </div>
      </div>
    </div>

    <form class="contact-form">
      <div class="field-row">
        <label>
          <span>Name</span>
          <input type="text" placeholder="Your name" />
        </label>
      </div>

      <div class="field-row two-columns">
        <label>
          <span>Email</span>
          <input type="email" placeholder="your@email.com" />
        </label>
        <label>
          <span>Company</span>
          <input type="text" placeholder="Company name" />
        </label>
      </div>

      <div class="field-row">
        <label>
          <span>Project details</span>
          <textarea rows="5" placeholder="Tell us about your workflow, challenge, or system needs"></textarea>
        </label>
      </div>

      <button type="submit" class="primary-btn">Send inquiry</button>
    </form>
  </div>
</section>
